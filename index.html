              "addressLocality": "Lahore",
              "addressCountry": "PK"

            "name": "Zara Rafiq Portfolio",
            "description": "Personal portfolio of Zara Rafiq showcasing eBay listing preparation, product research, Canva design, and social media content planning."

  <body class="bg-[#0A0A0A] text-[#F5F5F4] antialiased selection:bg-[#F7D928] selection:text-[#111111]">
